<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Status - PingGuard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .status-badge { display: inline-block; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 1.2em; color: white; }
        .status-up { background-color: #2ecc71; }
        .status-down { background-color: #e74c3c; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #2c3e50; }
        .stat-label { color: #7f8c8d; text-transform: uppercase; font-size: 0.8em; letter-spacing: 1px; }
        .footer { text-align: center; margin-top: 40px; color: #95a5a6; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${monitor.name}">Website Name</h1>
            <a th:href="${monitor.url}" target="_blank" th:text="${monitor.url}" style="color: #3498db; text-decoration: none;">http://example.com</a>
            <div style="margin-top: 20px;">
                <span class="status-badge status-up" th:if="${monitor.currentStatus == 'UP'}">ALL SYSTEMS OPERATIONAL</span>
                <span class="status-badge status-down" th:if="${monitor.currentStatus == 'DOWN'}">SYSTEM OUTAGE</span>
            </div>
        </div>

        <div class="card">
            <h3>Uptime Metrics</h3>
            <div class="stats-grid">
                <div>
                    <div class="stat-value" th:text="${stats.uptimePercentage24h + '%'}">99.9%</div>
                    <div class="stat-label">Last 24 Hours</div>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.uptimePercentage7d + '%'}">99.9%</div>
                    <div class="stat-label">Last 7 Days</div>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.uptimePercentage30d + '%'}">99.9%</div>
                    <div class="stat-label">Last 30 Days</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Recent Checks</h3>
            <p>Monitored every <span th:text="${monitor.checkInterval}">60</span> seconds.</p>
            <p>Last checked at: <strong th:text="${#temporals.format(monitor.lastCheckedAt, 'yyyy-MM-dd HH:mm:ss')}">2023-01-01 12:00:00</strong></p>
        </div>

        <div class="footer">
            Powered by <strong>PingGuard</strong> - The modern uptime monitoring solution.
        </div>
    </div>
</body>
</html>
